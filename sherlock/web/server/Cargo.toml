[package]
name = "sherlock_web"
version = "0.1.0"
description = "Read-only web server for a library published by the Frank Sherlock desktop app"
authors = ["AkitaOnRails"]
license = "GPL-3.0-only"
edition = "2021"
# Same floor as `sherlock_core`: the locked dependencies include crates written for
# `edition = "2024"`, so 1.85 is the oldest toolchain that can build this crate.
rust-version = "1.85"

[lib]
name = "sherlock_web"
path = "src/lib.rs"

[[bin]]
name = "sherlock-web"
path = "src/main.rs"

# Reads `sherlock_core`, never `sherlock_app_lib`: pulling the desktop crate in would drag
# Tauri, `ort` and `pdfium-render` into the image the container builds, for code this
# server never calls.
[features]
# Embed `sherlock/web/ui/dist` into the binary (built in the Docker image and in CI).
# Off by default so `cargo test` works without a frontend build.
embed-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
axum = "0.8"
env_logger = "0.11"
# `?w=` derivatives: decode the original, downscale it, encode a JPEG. Same version
# `sherlock_core` already compiles, so the container does not build two copies.
image = "0.25"
log = "0.4"
mime_guess = { version = "2", optional = true }
rust-embed = { version = "8", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sherlock_core = { path = "../../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
tower = { version = "0.5", features = ["util"] }
# `ServeFile` is what gives `/api/media` correct `Range` support without hand-rolling it.
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
