name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: macos-latest
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: sherlock/desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            ffmpeg

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The frontend is an npm workspace rooted at the repository: `shared` and the
      # desktop app are installed together, and the lockfile lives at the root.
      - name: Install frontend dependencies
        run: npm ci

      - name: Run shared package tests
        run: npm run test --workspace @frank-sherlock/shared

      - name: Typecheck shared package
        run: npm run typecheck --workspace @frank-sherlock/shared

      - name: Download PDFium
        working-directory: sherlock/desktop/src-tauri
        shell: bash
        run: bash scripts/download-pdfium.sh

      - name: Download ONNX Runtime
        working-directory: sherlock/desktop/src-tauri
        shell: bash
        run: bash scripts/download-onnxruntime.sh

      # The shared read core is a standalone crate (path dependency), so it is built
      # and tested on its own before the app that consumes it.
      - name: Run core tests
        working-directory: sherlock/core
        run: cargo test

      - name: Check core formatting
        working-directory: sherlock/core
        run: cargo fmt --check

      - name: Clippy (core)
        working-directory: sherlock/core
        run: cargo clippy -- -D warnings

      # The web server is a third standalone crate: it links `core` and must never link
      # the desktop (Tauri, ort, pdfium), which is exactly what this build proves.
      - name: Run web server tests
        working-directory: sherlock/web/server
        run: cargo test

      - name: Check web server formatting
        working-directory: sherlock/web/server
        run: cargo fmt --check

      - name: Clippy (web server)
        working-directory: sherlock/web/server
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: sherlock/desktop/src-tauri
        run: cargo test

      - name: Check Rust formatting
        working-directory: sherlock/desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: sherlock/desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: Build frontend
        working-directory: sherlock/desktop
        run: npm run build

      - name: Run frontend tests
        working-directory: sherlock/desktop
        run: npm run test

      - name: Audit dependencies
        if: runner.os == 'Linux'
        working-directory: sherlock/desktop/src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit
